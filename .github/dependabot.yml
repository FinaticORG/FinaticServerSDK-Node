version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    target-branch: develop
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      prefix-development: chore
      include: scope
    groups:
      production-dependencies:
        dependency-type: production
        update-types:
          - "minor"
          - "patch"
      development-dependencies:
        dependency-type: development
        update-types:
          - "minor"
          - "patch"
    ignore:
      # TypeScript majors need a deliberate upgrade, not an auto-PR.
      - dependency-name: typescript
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    target-branch: develop
    commit-message:
      prefix: ci
      prefix-development: ci
      include: scope
    groups:
      ci-dependencies:
        patterns:
          - "*"
